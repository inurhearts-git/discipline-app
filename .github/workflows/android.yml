# Builds the Android app (android/) and publishes the APK as a GitHub
# pre-release named "android-test-<run number>". Runs when android/ or this
# file changes on main, and from the Actions tab (Run workflow).
#
# Signing: set these repository secrets to sign with your own private key
# (needed before the Play Store); without them the public test key is used.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Errors are also written as annotations (::error::), so a failed run can
      # be read from the commit's checks without opening the log.
      - name: Gradle and Android SDK
        run: |
          set -o pipefail
          GV=8.9
          curl -sSfL "https://services.gradle.org/distributions/gradle-$GV-bin.zip" -o "$RUNNER_TEMP/gradle.zip" || { echo "::error::Couldn't download Gradle $GV"; exit 1; }
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GV/bin" >> "$GITHUB_PATH"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          [ -d "$SDK" ] || { echo "::error::No Android SDK on this runner (ANDROID_HOME is empty)"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > "$RUNNER_TEMP/sdk.log" 2>&1 || { echo "::error::sdkmanager failed: $(tail -3 "$RUNNER_TEMP/sdk.log" | tr '\n' ' ')"; exit 1; }
          fi

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "Signing with the private key from secrets."
          else
            unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            echo "No signing secrets: using the public test key."
          fi
          if ! gradle assembleRelease --no-daemon > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "error:|ERROR|FAILURE|What went wrong|> " "$RUNNER_TEMP/build.log" | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            tail -40 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/build.log"

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="discipline-android-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "android-test-${{ github.run_number }}" "$APK" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Android test build ${{ github.run_number }}" \
            --notes "Discipline for Android, test build ${{ github.run_number }} from ${{ github.sha }}. Install on an Android phone (allow installs from this source). Opens the live site full screen." \
            || { echo "::error::Couldn't create the release"; exit 1; }
