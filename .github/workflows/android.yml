# Builds the Android app (android/) and publishes the APK as a GitHub
# pre-release named "android-test-<run number>". Runs when android/ or this
# file changes on main, and from the Actions tab (Run workflow).
#
# Signing: set these repository secrets to sign with your own private key
# (needed before the Play Store); without them the public test key is used.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            echo "Signing with the private key from secrets."
          else
            unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            echo "No signing secrets: using the public test key."
          fi
          gradle assembleRelease --no-daemon --stacktrace

      - name: Publish as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="discipline-android-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "android-test-${{ github.run_number }}" "$APK" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Android test build ${{ github.run_number }}" \
            --notes "Discipline for Android, test build ${{ github.run_number }} from ${{ github.sha }}. Install on an Android phone (allow installs from this source). Opens the live site full screen."
